<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WangLab Portal · 资源黄页</title>
<style>
:root{
  --bg:#eef1f4; --bg2:#ffffff; --card:#ffffff; --line:#e2e7ec; --line2:#eef1f4;
  --tx:#182430; --tx2:#5b6b7d; --tx3:#93a1b0;
  --accent:#00a9c4; --accent2:#00c1de; --dark:#161d26; --dark2:#1e2833;
  --shadow:0 1px 2px rgba(22,29,38,.05), 0 8px 24px -12px rgba(22,29,38,.18);
  --shadow-lg:0 12px 40px -12px rgba(22,29,38,.28);
  --r:10px;
}
html[data-theme="dark"]{
  --bg:#0e1319; --bg2:#151c24; --card:#18212b; --line:#243040; --line2:#1c252f;
  --tx:#e6edf3; --tx2:#9fb0c2; --tx3:#6b7d90;
  --accent:#22d3ee; --accent2:#67e8f9; --dark:#0b1016; --dark2:#111823;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 16px 48px -12px rgba(0,0,0,.75);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font:14px/1.55 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,Arial,sans-serif;
  background:var(--bg); color:var(--tx); -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:60;background:var(--dark);box-shadow:0 2px 12px rgba(0,0,0,.18)}
.hd::before{content:"";display:block;height:3px;background:linear-gradient(to left,#4cd964,#5ac8fa,#007aff,#34aadc,#5856d6,#ff2d55)}
.hd-in{max-width:1560px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px rgba(0,193,222,.18)}
.brand em{font-style:normal;font-weight:400;font-size:12px;color:#8fa3b5;padding-left:2px}
.search{flex:1;max-width:560px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;width:15px;height:15px;stroke:#7d8f9f;fill:none;stroke-width:2}
.search input{width:100%;height:38px;border-radius:19px;border:1px solid #2b3745;background:#0f151c;color:#e8eef4;padding:0 74px 0 34px;outline:none;transition:.18s}
.search input::placeholder{color:#6b7d8f}
.search input:focus{border-color:var(--accent);background:#0b1117;box-shadow:0 0 0 3px rgba(0,169,196,.16)}
.search kbd{position:absolute;right:44px;font:11px/1 monospace;color:#7d8f9f;border:1px solid #2b3745;border-radius:4px;padding:3px 5px}
.search .clr{position:absolute;right:8px;width:26px;height:26px;border-radius:50%;color:#8fa3b5;font-size:16px;line-height:1;display:none}
.search.hasval .clr{display:block}
.search.hasval kbd{display:none}
.search .clr:hover{background:#1b2430;color:#fff}
.hd-act{display:flex;align-items:center;gap:6px;margin-left:auto}
.hbtn{height:34px;padding:0 12px;border-radius:8px;color:#c3d0dc;font-size:13px;display:flex;align-items:center;gap:6px;transition:.16s;white-space:nowrap}
.hbtn:hover{background:#1f2937;color:#fff}
.hbtn.on{background:var(--accent);color:#04141a;font-weight:600}
.hbtn .c{font-size:11px;opacity:.75}

/* ---------- layout ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:18px 20px 90px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px}
.side{align-self:start;position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:#cfd8e1;border-radius:3px}
html[data-theme="dark"] .side::-webkit-scrollbar-thumb{background:#2c3a49}
.side h4{font-size:11px;letter-spacing:1.4px;color:var(--tx3);font-weight:600;margin:4px 0 8px 8px}
#nav{display:flex;flex-direction:column;gap:1px;margin-bottom:16px}
#nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--tx2);font-size:13.5px;transition:.14s}
#nav a:hover{background:var(--bg2);color:var(--tx);box-shadow:var(--shadow)}
#nav a.on{background:var(--bg2);color:var(--tx);font-weight:600;box-shadow:var(--shadow)}
#nav a.on .k{background:var(--accent);color:#fff}
#nav .k{width:20px;height:20px;border-radius:6px;background:var(--line2);color:var(--tx3);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
#nav .g{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav .n{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}

.tagbox{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--tx2);background:var(--bg2);transition:.14s;cursor:pointer}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.tag.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tag .n{opacity:.55;font-size:10px;margin-left:3px}

.side-foot{border-top:1px dashed var(--line);padding-top:12px;font-size:11.5px;color:var(--tx3);line-height:1.9}
.side-foot b{color:var(--tx2);font-variant-numeric:tabular-nums}
.side-foot button{margin-top:8px;font-size:11.5px;color:var(--accent);text-decoration:underline}

/* ---------- main ---------- */
main{min-width:0}
.recbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.recbar:empty{display:none}
.recbar .lb{font-size:11.5px;color:var(--tx3);letter-spacing:.5px}
.recbar a{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);transition:.14s;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recbar a:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow)}

section.sec{margin-bottom:26px;scroll-margin-top:78px}
.sechd{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sechd .bar{width:4px;height:16px;border-radius:2px;background:var(--accent)}
.sechd h3{font-size:15px;font-weight:700;letter-spacing:.3px}
.sechd .cnt{font-size:11px;color:var(--tx3);background:var(--line2);border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}
.sechd .acts2{margin-left:auto;display:flex;gap:4px;opacity:0;transition:.16s}
section.sec:hover .acts2{opacity:1}
.mini{font-size:11.5px;color:var(--tx3);padding:3px 8px;border-radius:6px}
.mini:hover{background:var(--bg2);color:var(--accent);box-shadow:var(--shadow)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:.16s;overflow:hidden}
.card:hover{border-color:#c9d6e2;box-shadow:var(--shadow-lg);transform:translateY(-2px)}
html[data-theme="dark"] .card:hover{border-color:#33465c}
.cardlink{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;min-height:60px}
.ico{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;background:hsl(var(--h) 62% 52%)}
html[data-theme="dark"] .ico{background:hsl(var(--h) 45% 42%)}
.ct{min-width:0;flex:1}
.cn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;font-weight:600;line-height:1.35;color:var(--tx);overflow:hidden;word-break:break-word}
.cu{display:block;font-size:10.5px;color:var(--tx3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,Menlo,monospace}
.ctags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ctags i{font-style:normal;font-size:10px;padding:0 5px;border-radius:4px;background:var(--line2);color:var(--tx3);line-height:15px}
.card .badge{position:absolute;top:0;right:0;font-size:9.5px;padding:1px 5px;border-bottom-left-radius:6px;background:rgba(0,169,196,.12);color:var(--accent)}
.acts{position:absolute;right:6px;bottom:6px;display:flex;gap:2px;opacity:0;transform:translateY(3px);transition:.15s;background:linear-gradient(90deg,transparent,var(--card) 22%)}
.card:hover .acts{opacity:1;transform:none}
.acts button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--tx3);font-size:12px}
.acts button:hover{background:var(--line2);color:var(--accent)}
.acts button.faved{color:#f5a623}
body.editing .acts{opacity:1;transform:none}

.empty{text-align:center;color:var(--tx3);padding:70px 0;font-size:13px}
.empty b{display:block;font-size:34px;margin-bottom:10px;opacity:.35}

/* ---------- dock ---------- */
.dock{position:fixed;right:22px;bottom:22px;z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{width:50px;height:50px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-lg);position:relative;transition:.18s;font-size:19px}
.fab:hover{transform:translateY(-2px);background:var(--accent);color:#04141a}
.fab .fb{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:#ff5b5b;color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.panel{width:308px;max-height:min(66vh,540px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:12px;display:none}
.panel.open{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}}
.panel h5{font-size:12px;color:var(--tx3);letter-spacing:1px;margin:2px 2px 8px;display:flex;align-items:center}
.panel h5 button{margin-left:auto;color:var(--accent);font-size:11px;text-decoration:underline}
.pit{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:12.5px}
.pit:hover{background:var(--line2)}
.pit .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.pit button{font-size:11px;color:var(--accent);padding:2px 6px;border-radius:5px}
.pit button:hover{background:rgba(0,169,196,.12)}
.pemp{font-size:12px;color:var(--tx3);text-align:center;padding:18px 0;line-height:1.9}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(12,18,24,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.mask.open{display:flex}
.modal{width:100%;max-width:460px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow-lg)}
.modal h3{font-size:15px;margin-bottom:14px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11.5px;color:var(--tx3);margin-bottom:4px}
.fld input,.fld select{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:0 10px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,169,196,.14)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.bt{height:34px;padding:0 14px;border-radius:8px;font-size:13px}
.bt.p{background:var(--accent);color:#fff;font-weight:600}
.bt.g{color:var(--tx2)}
.bt.g:hover{background:var(--line2)}
.kbdhelp{font-size:12.5px;color:var(--tx2);line-height:2.05}
.kbdhelp kbd{font:11px/1 monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--bg)}

@media(max-width:1080px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:14px}
  .side,.side-foot{min-width:0}
  .side{position:static;max-height:none;overflow:visible}
  .side h4{margin-left:0}
  #nav{flex-direction:row;overflow-x:auto;padding-bottom:4px;max-width:100%}
  #nav a{white-space:nowrap;border:1px solid var(--line);background:var(--bg2)}
  #nav .n{display:none}
  .hd-in{flex-wrap:wrap;gap:10px}
  .brand em{display:none}
  .search{order:3;max-width:none;flex-basis:100%}
  .hd-act{margin-left:auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .acts{opacity:1;transform:none}
}
@media(max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .brand{font-size:15px}
  .hbtn{padding:0 8px;font-size:12px}
  .cn{font-size:12.5px}
  section.sec{margin-bottom:20px}
}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <a class="brand" href="#" id="brand"><span class="dot"></span>WangLab Portal<em>个人资源黄页</em></a>
    <div class="search" id="sbox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

    </div>
  </div>
</header>

<div class="wrap">
  <aside class="side">

    <div class="tagbox" id="tagbox"></div>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main>

    <div class="recbar" id="recbar"></div>
    <div id="sections"></div>
  </main>
</div>

<div class="dock">

  <button class="fab" id="btnDock" title="隐藏夹">☰<span class="fb" id="hideN">0</span></button>
</div>

<div class="mask" id="mask">
  <div class="modal" id="modal"></div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "wanglab_portal_v1";
  var CATMAP = {}; CATS.forEach(function(c){ CATMAP[c.k] = c; });
  var ALLTAGS = ["常用","内网","需登录","需代理","中文","视频","文档","教程","下载","软件","期刊","数据库","计算","绘图","硬件","试剂耗材","招聘","方法","搜索"];

  /* ---------- state ---------- */
  var S = {fav:[], hide:[], custom:[], recent:[], noFav:[], theme:"light", favOnly:false, tags:[]};
  try { var raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
  var favSet = new Set(S.fav), hideSet = new Set(S.hide), noFavSet = new Set(S.noFav);
  function save(){
    S.fav = Array.from(favSet); S.hide = Array.from(hideSet); S.noFav = Array.from(noFavSet);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  }

  /* ---------- data ---------- */
  function idOf(it){ return it.u === "bing" ? "q:" + it.n : it.u; }
  var ALL = ITEMS.concat(S.custom).map(function(it){
    var o = {}; for(var k in it) o[k] = it[k]; o.id = idOf(it); return o;
  });
  var byCat = {};
  ALL.forEach(function(it){ (byCat[it.c] = byCat[it.c] || []).push(it); });

  function hostOf(it){
    if(it.u === "bing") return "搜索 · " + it.n;
    try { return new URL(it.u).host.replace(/^www\./,""); } catch(e){ return it.u; }
  }
  function hrefOf(it){
    return it.u === "bing" ? "https://cn.bing.com/search?q=" + encodeURIComponent(it.n + " 官网 下载") : it.u;
  }
  function favOf(it){ return favSet.has(it.id) || (it.t.indexOf("常用") >= 0 && !noFavSet.has(it.id)); }
  function hue(s){ var h = 0; for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 360; return h; }
  function initial(it){
    var n = (it.n||"").trim();
    if(!n) return "#";
    if(/[\u4e00-\u9fa5]/.test(n.charAt(0))) return n.charAt(0);
    var h = hostOf(it).charAt(0); return (/[a-z]/i.test(h) ? h.toUpperCase() : n.charAt(0));
  }

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- nav ---------- */
  var nav = $("nav");
  function renderNav(){
    var cnt = {}, favCnt = 0;
    ALL.forEach(function(it){
      if(hideSet.has(it.id)) return;
      cnt[it.c] = (cnt[it.c]||0) + 1;
      if(favOf(it)) favCnt++;
    });
    var html = CATS.map(function(c){
      return '<a href="#sec-'+c.k+'" data-k="'+c.k+'"><span class="k">'+c.i+'</span><span class="g">'+c.n+'</span><span class="n">'+(cnt[c.k]||0)+'</span></a>';
    }).join("");
    html += '<a href="#sec-fav" data-k="__fav"><span class="k" style="background:#f7e2a8;color:#a4711a">★</span><span class="g">收藏与常用</span><span class="n">'+favCnt+'</span></a>';
    nav.innerHTML = html;
    var first = nav.querySelector("a"); if(first) first.classList.add("on");
  }
  nav.addEventListener("click", function(e){
    var a = e.target.closest("a"); if(!a) return;
    if(a.dataset.k === "__fav"){ e.preventDefault(); $("btnFav").click(); return; }
    nav.querySelectorAll("a").forEach(function(x){ x.classList.remove("on"); });
    a.classList.add("on");
  });

  /* ---------- tags ---------- */
  var tagbox = $("tagbox");
  function renderTags(){
    var cnt = {};
    ALL.forEach(function(it){
      if(hideSet.has(it.id)) return;
      it.t.forEach(function(t){ if(ALLTAGS.indexOf(t) >= 0) cnt[t] = (cnt[t]||0)+1; });
    });
    tagbox.innerHTML = ALLTAGS.filter(function(t){ return cnt[t]; })
      .sort(function(a,b){ return cnt[b]-cnt[a]; })
      .map(function(t){ return '<span class="tag'+(S.tags.indexOf(t)>=0?" on":"")+'" data-t="'+t+'">'+t+'<span class="n">'+cnt[t]+'</span></span>'; })
      .join("");
  }
  tagbox.addEventListener("click", function(e){
    var el = e.target.closest(".tag"); if(!el) return;
    var t = el.dataset.t, i = S.tags.indexOf(t);
    if(i >= 0) S.tags.splice(i,1); else S.tags.push(t);
    renderTags(); renderMain();
  });

  /* ---------- filter ---------- */
  var qEl = $("q"), sbox = $("sbox"), Q = "";
  function match(it){
    if(S.favOnly && !favOf(it)) return false;
    if(S.tags.length && !S.tags.some(function(t){ return it.t.indexOf(t) >= 0; })) return false;
    if(!Q) return true;
    var hay = (it.n+" "+it.u+" "+it.t.join(" ")+" "+(CATMAP[it.c]?CATMAP[it.c].n:"")+" "+(it.d||"")).toLowerCase();
    return Q.split(/\s+/).filter(Boolean).every(function(w){ return hay.indexOf(w.toLowerCase()) >= 0; });
  }

  /* ---------- card ---------- */
  function card(it){
    var f = favOf(it);
    var tags = it.t.filter(function(t){ return t !== "常用"; }).slice(0,3);
    return '<div class="card" data-id="'+it.id+'" style="--h:'+hue(hostOf(it))+'">'
      + '<a class="cardlink" href="'+hrefOf(it)+'" target="_blank" rel="noopener" data-open="'+it.id+'">'
      +   '<span class="ico">'+initial(it)+'</span>'
      +   '<span class="ct"><span class="cn">'+it.n+'</span><span class="cu">'+hostOf(it)+'</span>'
      +     (tags.length ? '<span class="ctags">'+tags.map(function(t){return '<i>'+t+'</i>';}).join("")+'</span>' : '')
      +   '</span>'
      + '</a>'
      + (f ? '<span class="badge">★</span>' : '')
      + '<div class="acts">'
      +   '<button data-act="fav" class="'+(f?"faved":"")+'" title="'+(f?"取消收藏":"收藏")+'">★</button>'
      +   '<button data-act="hide" title="隐藏到隐藏夹">◍</button>'
      +   '<button data-act="copy" title="复制链接">⧉</button>'
      + '</div></div>';
  }
  function sec(id, name, n, list, desc){
    return '<section class="sec" id="'+id+'">'
      + '<div class="sechd"><span class="bar"></span><h3'+(desc?' title="'+desc+'"':'')+'>'+name+'</h3>'
      + '<span class="cnt">'+n+'</span>'
      + '<div class="acts2"><button class="mini" data-openall="'+id+'">批量打开</button></div></div>'
      + '<div class="grid">'+list.map(card).join("")+'</div></section>';
  }

  /* ---------- main ---------- */
  var sections = $("sections"), favbar = $("favbar");
  function renderFavBar(){
    var favs = ALL.filter(function(it){ return !hideSet.has(it.id) && favOf(it); });
    favbar.innerHTML = (favs.length && !S.favOnly)
      ? '<span class="lb">★ 常用</span>' + favs.map(function(it){
          return '<a href="'+hrefOf(it)+'" target="_blank" rel="noopener" data-open="'+it.id+'" title="'+hostOf(it)+'">'+it.n+'</a>';
        }).join("")
      : "";
  }
  function renderMain(){
    var html = "";
    var favs = ALL.filter(function(it){ return !hideSet.has(it.id) && favOf(it) && match(it); });
    if(S.favOnly){
      if(favs.length) html = sec("sec-fav", "★ 收藏与常用", favs.length, favs, "标注「常用」的站点默认在这里，可在卡片上取消");
    } else {
      CATS.forEach(function(c){
        var list = (byCat[c.k]||[]).filter(function(it){ return !hideSet.has(it.id) && match(it); });
        if(list.length) html += sec("sec-"+c.k, c.n, list.length, list, c.d);
      });
    }
    if(!html) html = '<div class="empty"><b>∅</b>'
      + (S.favOnly ? "还没有收藏 / 常用站点，把鼠标移到卡片上点 ★ 即可" : "没有匹配的站点，换个关键词或标签试试") + '</div>';
    sections.innerHTML = html;
    $("favN").textContent = ALL.filter(favOf).length;
    renderFavBar(); renderFoot();
    if(S.favOnly) syncNav("__fav");
  }
  function syncNav(k){
    nav.querySelectorAll("a").forEach(function(a){ a.classList.toggle("on", a.dataset.k === k); });
  }

  /* ---------- foot ---------- */
  function renderFoot(){
    var n = ALL.filter(function(it){ return !hideSet.has(it.id); }).length;
    $("foot").innerHTML = "站点 <b>"+n+"</b> / 全部 <b>"+ALL.length+"</b><br>"
      + "收藏 <b>"+ALL.filter(favOf).length+"</b> · 隐藏 <b>"+hideSet.size+"</b> · 自定义 <b>"+S.custom.length+"</b><br>"
      + '<button id="footReset">清空筛选</button>';
    $("footReset").onclick = function(){
      S.tags = []; S.favOnly = false; Q = ""; qEl.value = ""; sbox.classList.remove("hasval");
      $("btnFav").classList.remove("on"); renderTags(); renderMain();
      var f = nav.querySelector('a[data-k]:not([data-k="__fav"])'); if(f) syncNav(f.dataset.k);
    };
  }

  /* ---------- recent ---------- */
  var recbar = $("recbar");
  function renderRec(){
    var list = (S.recent||[]).map(function(id){
      return ALL.filter(function(x){ return x.id === id; })[0];
    }).filter(function(x){ return x && !hideSet.has(x.id); }).slice(0,7);
    recbar.innerHTML = list.length
      ? '<span class="lb">最近访问</span>' + list.map(function(it){
          return '<a href="'+hrefOf(it)+'" target="_blank" rel="noopener" data-open="'+it.id+'">'+it.n+'</a>';
        }).join("")
      : "";
  }
  function track(id){
    S.recent = [id].concat((S.recent||[]).filter(function(x){ return x !== id; })).slice(0,12);
    save(); renderRec();
  }

  /* ---------- dock ---------- */
  var panel = $("panel"), pList = $("pList"), hideN = $("hideN");
  $("btnDock").addEventListener("click", function(e){
    e.stopPropagation(); panel.classList.toggle("open"); renderDock();
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest(".dock")) panel.classList.remove("open");
  });
  function renderDock(){
    var list = ALL.filter(function(it){ return hideSet.has(it.id); });
    hideN.textContent = list.length;
    hideN.style.display = list.length ? "grid" : "none";
    pList.innerHTML = list.length ? list.map(function(it){
      return '<div class="pit" data-id="'+it.id+'">'
        + '<span class="ico" style="--h:'+hue(hostOf(it))+';width:22px;height:22px;font-size:10.5px;border-radius:6px">'+initial(it)+'</span>'
        + '<span class="pn">'+it.n+'</span><button data-act="unhide">恢复</button></div>';
    }).join("") : '<div class="pemp">隐藏夹是空的<br>卡片右下角「◍」可隐藏不常用的站点</div>';
  }
  $("restoreAll").addEventListener("click", function(){
    hideSet.clear(); save(); renderNav(); renderTags(); renderMain(); renderDock(); renderRec();
  });
  pList.addEventListener("click", function(e){
    var b = e.target.closest('[data-act="unhide"]'); if(!b) return;
    hideSet.delete(b.closest(".pit").dataset.id);
    save(); renderNav(); renderTags(); renderMain(); renderDock(); renderRec();
  });

  /* ---------- global click ---------- */
  document.addEventListener("click", function(e){
    var openall = e.target.closest("[data-openall]");
    if(openall){
      var links = [].slice.call(document.querySelectorAll("#"+openall.dataset.openall+" .cardlink"));
      if(links.length && confirm("将打开该分组下 "+links.length+" 个链接，浏览器可能拦截多个弹窗。继续？")){
        links.forEach(function(a){ window.open(a.href, "_blank"); });
      }
      return;
    }
    var opened = e.target.closest("[data-open]");
    if(opened){ track(opened.dataset.open); return; }
    var cardEl = e.target.closest(".card");
    if(!cardEl) return;
    var btn = e.target.closest("button[data-act]");
    if(!btn) return;
    e.preventDefault();
    var it = ALL.filter(function(x){ return x.id === cardEl.dataset.id; })[0];
    if(!it) return;
    var act = btn.dataset.act;
    if(act === "fav"){
      if(favOf(it)){ favSet.delete(it.id); noFavSet.add(it.id); }
      else { noFavSet.delete(it.id); favSet.add(it.id); }
      save(); renderNav(); renderMain();
    }
    if(act === "hide"){
      hideSet.add(it.id); save();
      renderNav(); renderTags(); renderMain(); renderDock(); renderRec();
      toast("已加入隐藏夹：" + it.n);
    }
    if(act === "copy"){
      var txt = hrefOf(it);
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ toast("已复制：" + txt); }, function(){ prompt("复制链接：", txt); });
      else prompt("复制链接：", txt);
    }
  });

  /* ---------- search ---------- */
  qEl.addEventListener("input", function(){
    Q = qEl.value.trim();
    sbox.classList.toggle("hasval", !!Q);
    renderMain();
  });
  $("clr").addEventListener("click", function(){
    qEl.value = ""; Q = ""; sbox.classList.remove("hasval"); renderMain(); qEl.focus();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); return; }
    if(e.key === "Escape"){
      $("mask").classList.remove("open");
      if(document.activeElement === qEl){ qEl.blur(); }
      else if(Q){ qEl.value=""; Q=""; sbox.classList.remove("hasval"); renderMain(); }
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); qEl.focus(); qEl.select(); }
  });

  /* ---------- toolbar ---------- */
  var btnFav = $("btnFav");
  btnFav.addEventListener("click", function(){
    S.favOnly = !S.favOnly;
    btnFav.classList.toggle("on", S.favOnly);
    renderMain();
    if(!S.favOnly){
      var f = nav.querySelector('a[data-k]:not([data-k="__fav"])');
      if(f) syncNav(f.dataset.k);
    }
    window.scrollTo({top:0, behavior:"smooth"});
  });
  var btnEdit = $("btnEdit");
  btnEdit.addEventListener("click", function(){
    var on = document.body.classList.toggle("editing");
    btnEdit.classList.toggle("on", on);
    toast(on ? "管理模式：卡片右下角常显 ★收藏 / ◍隐藏 / ⧉复制" : "已退出管理模式");
  });
  var btnTheme = $("btnTheme");
  function applyTheme(){
    document.documentElement.dataset.theme = S.theme;
    btnTheme.textContent = S.theme === "dark" ? "☀" : "☾";
    btnTheme.title = S.theme === "dark" ? "切换为浅色" : "切换为深色";
  }
  btnTheme.addEventListener("click", function(){
    S.theme = S.theme === "dark" ? "light" : "dark"; save(); applyTheme();
  });
  $("brand").addEventListener("click", function(e){ e.preventDefault(); window.scrollTo({top:0, behavior:"smooth"}); });

  /* ---------- modal ---------- */
  var mask = $("mask"), modal = $("modal");
  function openModal(html){ modal.innerHTML = html; mask.classList.add("open"); }
  mask.addEventListener("click", function(e){ if(e.target === mask) mask.classList.remove("open"); });

  $("btnAdd").addEventListener("click", function(){
    openModal('<h3>添加站点</h3>'
      + '<div class="fld"><label>名称</label><input id="f-n" placeholder="例：NCBI BLAST"></div>'
      + '<div class="fld"><label>网址（留空则生成搜索链接）</label><input id="f-u" placeholder="https://…"></div>'
      + '<div class="fld"><label>分类</label><select id="f-c">'+CATS.map(function(c){return '<option value="'+c.k+'">'+c.n+'</option>';}).join("")+'</select></div>'
      + '<div class="fld"><label>标签（逗号分隔）</label><input id="f-t" placeholder="中文,视频"></div>'
      + '<div class="row"><button class="bt g" data-close>取消</button><button class="bt p" id="f-ok">保存</button></div>');
    setTimeout(function(){ $("f-n").focus(); }, 30);
  });
  modal.addEventListener("click", function(e){
    if(e.target.closest("[data-close]")){ mask.classList.remove("open"); return; }
    if(e.target.id === "f-ok"){
      var n = $("f-n").value.trim(), u = $("f-u").value.trim(),
          c = $("f-c").value, t = $("f-t").value.split(/[,，\s]+/).filter(Boolean);
      if(!n){ alert("请填写名称"); return; }
      S.custom.push({n:n, u:(u || "bing"), c:c, t:t, d:"自定义"});
      save(); location.reload();
    }
    if(e.target.id === "expBtn"){
      var blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "portal-config.json"; a.click();
    }
    if(e.target.id === "rstBtn"){
      if(confirm("清空本机保存的收藏 / 隐藏 / 自定义站点？不可撤销。")){ localStorage.removeItem(KEY); location.reload(); }
    }
  });
  $("btnHelp").addEventListener("click", function(){
    openModal('<h3>使用说明</h3><div class="kbdhelp">'
      + '<kbd>/</kbd> 或 <kbd>Ctrl</kbd>+<kbd>K</kbd> 聚焦搜索 · <kbd>Esc</kbd> 清空<br>'
      + '卡片右下角：<b>★</b> 收藏 · <b>◍</b> 隐藏（进右下角隐藏夹）· <b>⧉</b> 复制链接<br>'
      + '标注 <b>常用</b> 的站点默认出现在「收藏与常用」，取消收藏后会被记住。<br>'
      + '「只看收藏」「标签筛选」「搜索」可叠加使用；分组标题右侧「批量打开」可一次开整组。<br>'
      + '收藏 / 隐藏 / 自定义站点 / 主题都保存在本机浏览器，换电脑需重新设置（可导出配置）。<br>'
      + '共收录 <b>' + ALL.length + '</b> 条，来源：WangLab-Resource.html + WangLab资源信息.xlsx。'
      + '</div><div class="row"><button class="bt g" id="expBtn">导出配置</button>'
      + '<button class="bt g" id="rstBtn">重置本机设置</button><button class="bt p" data-close>知道了</button></div>');
  });

  /* ---------- toast ---------- */
  var toastEl;
  function toast(msg){
    if(!toastEl){
      toastEl = document.createElement("div");
      toastEl.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#161d26;color:#fff;font-size:12.5px;padding:9px 18px;border-radius:20px;z-index:200;opacity:0;transition:.2s;pointer-events:none;max-width:80vw;text-align:center";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg; toastEl.style.opacity = 1;
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function(){ toastEl.style.opacity = 0; }, 1900);
  }

  /* ---------- scroll spy ---------- */
  var ticking = false;
  window.addEventListener("scroll", function(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var y = window.scrollY + 130, cur = null;
      document.querySelectorAll("section.sec").forEach(function(s){ if(s.offsetTop <= y) cur = s.id; });
      if(!cur) return;
      nav.querySelectorAll("a").forEach(function(a){
        var id = a.dataset.k === "__fav" ? "sec-fav" : "sec-" + a.dataset.k;
        a.classList.toggle("on", id === cur);
      });
    });
  }, {passive:true});

  /* ---------- boot ---------- */
  applyTheme();
  renderNav(); renderTags(); renderMain(); renderDock(); renderRec();
})();
</script>
</body>
</html>
